name: Windows quality and signed updater lifecycle

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:native
      - run: node --test scripts/sign-update-test.cjs
      - name: Verify real Windows helper readiness and cancellation
        run: node --test scripts/handoff-windows-test.cjs
      - run: npm run test:e2e
        env:
          WORKBENCH_E2E_CAPTURE: '0'
      - run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify signed background update and retained data
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidateVersion = [version](Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if ($candidateVersion -lt [version]'1.3.0') {
            npm run test:updater
            exit $LASTEXITCODE
          }

          $baselineVersion = '1.2.0'
          $baselineFile = "Workbench-Setup-$baselineVersion-win-x64.exe"
          $baselineInstaller = Join-Path $env:RUNNER_TEMP $baselineFile
          $baselineUrl = "https://github.com/AureliusWu/Workbench/releases/download/v$baselineVersion/$baselineFile"
          curl.exe --fail --location --silent --show-error --retry 2 --retry-max-time 180 --max-time 120 --proto '=https' --proto-redir '=https' --output $baselineInstaller $baselineUrl
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the published Windows upgrade baseline.' }

          $expectedSha256 = 'bfaec5c921245f66f8a5c6af86f7b5f776b456f23cb8ae003a9bd6ab36bad037'
          $actualSha256 = (Get-FileHash -LiteralPath $baselineInstaller -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) { throw 'Published Windows upgrade baseline SHA-256 does not match.' }
          Write-Host "Verified published v$baselineVersion upgrade baseline SHA-256 $actualSha256"

          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/installer-lifecycle.ps1 -UseUpdater -BaselineVersion $baselineVersion -BaselineInstallerPath $baselineInstaller
          exit $LASTEXITCODE
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $artifactFiles = Get-ChildItem -LiteralPath release -Filter '*.exe'
          $checksumLines = $artifactFiles | ForEach-Object {
            $fileHash = Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256
            "$($fileHash.Hash.ToLower())  $($_.Name)"
          }
          Set-Content -LiteralPath release/SHA256SUMS.txt -Value $checksumLines -Encoding utf8NoBOM
      - name: Generate unsigned updater metadata
        run: npm run update:manifest
      - uses: actions/upload-artifact@v4
        with:
          name: Workbench-installer-windows-x64
          path: |
            release/*.exe
            release/SHA256SUMS.txt
            release/workbench-update.unsigned.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Workbench-smoke-evidence
          path: |
            artifacts/**/results.json
            artifacts/**/updater-results.json
            artifacts/**/*.png
            artifacts/**/process.log
            artifacts/**/handoff-*.log
          if-no-files-found: ignore
